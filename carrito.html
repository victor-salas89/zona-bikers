<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carrito - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- CARRITO -->
    <!-- ===================== -->

    <main class="container">

        <section>

            <h1>
                Mi carrito de compras
            </h1>


            <!-- PRODUCTOS DEL CARRITO -->

            <div id="listaCarrito">


                <!-- PRODUCTO DE EJEMPLO -->

                <article class="producto-carrito">

                    <img src="https://www.bikesport.cl/cdn/shop/files/ATOM2_NEGRO_1.png?v=1762894616"
                         alt="Casco integral para motociclista">

                    <h2>
                        Casco Integral
                    </h2>

                    <p>
                        Precio: $79.990
                    </p>

                    <label for="cantidadProducto1">
                        Cantidad
                    </label>

                    <input type="number"
                           id="cantidadProducto1"
                           min="1"
                           value="1">

                    <button type="button"
                            id="eliminarProducto1">
                        Eliminar
                    </button>

                </article>


            </div>


            <!-- ===================== -->
            <!-- RESUMEN -->
            <!-- ===================== -->

            <section class="resumen-carrito">

                <h2>
                    Resumen de compra
                </h2>

                <p>
                    Total:
                    <span id="totalCarrito">
                        $79.990
                    </span>
                </p>

                <button type="button"
                        id="vaciarCarrito">
                    Vaciar carrito
                </button>

                <button type="button"
                        id="finalizarCompra">
                    Finalizar compra
                </button>

            </section>


            <br>


            <a href="productos.html">
                Seguir comprando
            </a>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer>

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carrito - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="css/estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-biker">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- CARRITO -->
    <!-- ===================== -->

    <main class="container my-4">

        <section>

            <h1 class="mb-4">
                Mi carrito de compras
            </h1>


            <!-- PRODUCTOS DEL CARRITO -->

            <div id="listaCarrito"
                 class="mb-4">


                <!-- PRODUCTO DE EJEMPLO -->

                <article class="producto-carrito card card-biker mb-3">

                    <div class="row g-0 align-items-center">

                        <div class="col-3 col-sm-2">

                            <img src="https://www.bikesport.cl/cdn/shop/files/ATOM2_NEGRO_1.png?v=1762894616"
                                 alt="Casco integral para motociclista"
                                 class="img-fluid rounded-start p-2">

                        </div>

                        <div class="col-9 col-sm-10">

                            <div class="card-body d-flex flex-wrap align-items-center gap-3">

                                <h2 class="h6 mb-0 flex-grow-1">
                                    Casco Integral
                                </h2>

                                <p class="precio mb-0">
                                    Precio: $79.990
                                </p>

                                <div class="d-flex align-items-center gap-2">

                                    <label for="cantidadProducto1"
                                           class="form-label mb-0">
                                        Cantidad
                                    </label>

                                    <input type="number"
                                           id="cantidadProducto1"
                                           class="form-control form-control-sm"
                                           style="width: 5rem;"
                                           min="1"
                                           value="1">

                                </div>

                                <button type="button"
                                        id="eliminarProducto1"
                                        class="btn btn-outline-danger btn-sm">
                                    Eliminar
                                </button>

                            </div>

                        </div>

                    </div>

                </article>


            </div>


            <!-- ===================== -->
            <!-- RESUMEN -->
            <!-- ===================== -->

            <section class="resumen-carrito">

                <h2 class="h4">
                    Resumen de compra
                </h2>

                <p class="fs-5">
                    Total:
                    <span id="totalCarrito">
                        $79.990
                    </span>
                </p>

                <div class="d-flex gap-2 flex-wrap">

                    <button type="button"
                            id="vaciarCarrito"
                            class="btn btn-outline-light">
                        Vaciar carrito
                    </button>

                    <button type="button"
                            id="finalizarCompra"
                            class="btn btn-biker">
                        Finalizar compra
                    </button>

                </div>

            </section>


            <br>


            <a href="productos.html"
               class="btn btn-outline-biker mt-3">
                Seguir comprando
            </a>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- REGISTRO -->
    <!-- ===================== -->

    <main class="container">

        <section>

            <h1>
                Registro de usuario
            </h1>

            <p>
                Completa tus datos para crear una cuenta en Zona Bikers.
            </p>


            <form id="formRegistro">


                <!-- RUN -->

                <div>

                    <label for="run">
                        RUN
                    </label>

                    <input type="text"
                           id="run"
                           name="run"
                           minlength="7"
                           maxlength="9"
                           placeholder="Ejemplo: 19011022K">

                    <p id="errorRun"></p>

                </div>


                <!-- NOMBRE -->

                <div>

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="50"
                           placeholder="Ingrese su nombre">

                    <p id="errorNombre"></p>

                </div>


                <!-- APELLIDOS -->

                <div>

                    <label for="apellidos">
                        Apellidos
                    </label>

                    <input type="text"
                           id="apellidos"
                           name="apellidos"
                           maxlength="100"
                           placeholder="Ingrese sus apellidos">

                    <p id="errorApellidos"></p>

                </div>


                <!-- CORREO -->

                <div>

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese su correo">

                    <p id="errorCorreo"></p>

                </div>


                <!-- REGIÓN -->

                <div>

                    <label for="region">
                        Región
                    </label>

                    <select id="region"
                            name="region">

                        <option value="">
                            Seleccione una región
                        </option>

                    </select>

                    <p id="errorRegion"></p>

                </div>


                <!-- COMUNA -->

                <div>

                    <label for="comuna">
                        Comuna
                    </label>

                    <select id="comuna"
                            name="comuna">

                        <option value="">
                            Seleccione una comuna
                        </option>

                    </select>

                    <p id="errorComuna"></p>

                </div>


                <!-- DIRECCIÓN -->

                <div>

                    <label for="direccion">
                        Dirección
                    </label>

                    <input type="text"
                           id="direccion"
                           name="direccion"
                           maxlength="300"
                           placeholder="Ingrese su dirección">

                    <p id="errorDireccion"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit">
                    Registrarse
                </button>


            </form>


            <p>
                ¿Ya tienes una cuenta?
                <a href="login.html">
                    Iniciar sesión
                </a>
            </p>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer>

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

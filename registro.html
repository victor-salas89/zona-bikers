<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="css/estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-biker">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- REGISTRO -->
    <!-- ===================== -->

    <header class="page-header">

        <div class="container">

            <h1>
                Registro de usuario
            </h1>

            <p class="mb-0">
                Completa tus datos para crear una cuenta en Zona Bikers.
            </p>

        </div>

    </header>


    <main class="container my-4">

        <section class="row justify-content-center">

          <div class="col-md-8 col-lg-7">

            <div class="card card-biker p-4">

            <form id="formRegistro" class="form-biker">


                <!-- RUN -->

                <div class="mb-3">

                    <label class="form-label" for="run">
                        RUN
                    </label>

                    <input class="form-control" type="text"
                           id="run"
                           name="run"
                           minlength="7"
                           maxlength="9"
                           placeholder="Ejemplo: 19011022K">

                    <p id="errorRun" class="text-danger small"></p>

                </div>


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label" for="nombre">
                        Nombre
                    </label>

                    <input class="form-control" type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="50"
                           placeholder="Ingrese su nombre">

                    <p id="errorNombre" class="text-danger small"></p>

                </div>


                <!-- APELLIDOS -->

                <div class="mb-3">

                    <label class="form-label" for="apellidos">
                        Apellidos
                    </label>

                    <input class="form-control" type="text"
                           id="apellidos"
                           name="apellidos"
                           maxlength="100"
                           placeholder="Ingrese sus apellidos">

                    <p id="errorApellidos" class="text-danger small"></p>

                </div>


                <!-- CORREO -->

                <div class="mb-3">

                    <label class="form-label" for="correo">
                        Correo electrónico
                    </label>

                    <input class="form-control" type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese su correo">

                    <p id="errorCorreo" class="text-danger small"></p>

                </div>


                <!-- REGIÓN -->

                <div class="mb-3">

                    <label class="form-label" for="region">
                        Región
                    </label>

                    <select class="form-select" id="region"
                            name="region">

                        <option value="">
                            Seleccione una región
                        </option>

                    </select>

                    <p id="errorRegion" class="text-danger small"></p>

                </div>


                <!-- COMUNA -->

                <div class="mb-3">

                    <label class="form-label" for="comuna">
                        Comuna
                    </label>

                    <select class="form-select" id="comuna"
                            name="comuna">

                        <option value="">
                            Seleccione una comuna
                        </option>

                    </select>

                    <p id="errorComuna" class="text-danger small"></p>

                </div>


                <!-- DIRECCIÓN -->

                <div class="mb-3">

                    <label class="form-label" for="direccion">
                        Dirección
                    </label>

                    <input class="form-control" type="text"
                           id="direccion"
                           name="direccion"
                           maxlength="300"
                           placeholder="Ingrese su dirección">

                    <p id="errorDireccion" class="text-danger small"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit"
                        class="btn btn-biker">
                    Registrarse
                </button>


            </form>


            <p class="text-center mt-3">
                ¿Ya tienes una cuenta?
                <a href="login.html">
                    Iniciar sesión
                </a>
            </p>

            </div>

          </div>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contacto - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- CONTACTO -->
    <!-- ===================== -->

    <main class="container">

        <section>

            <h1>
                Contacto
            </h1>

            <p>
                Si tienes alguna consulta, puedes enviarnos un mensaje.
            </p>


            <form id="formContacto">


                <!-- NOMBRE -->

                <div>

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           placeholder="Ingrese su nombre">

                    <p id="errorNombre"></p>

                </div>


                <!-- CORREO -->

                <div>

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese su correo">

                    <p id="errorCorreo"></p>

                </div>


                <!-- COMENTARIO -->

                <div>

                    <label for="comentario">
                        Comentario
                    </label>

                    <textarea id="comentario"
                              name="comentario"
                              rows="5"
                              maxlength="500"
                              placeholder="Escriba su mensaje">
                    </textarea>

                    <p id="errorComentario"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit">
                    Enviar mensaje
                </button>


            </form>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer>

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

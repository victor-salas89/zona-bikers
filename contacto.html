<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contacto - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="css/estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-biker">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Inicio
                </a>

                <a class="nav-link" href="productos.html">
                    Productos
                </a>

                <a class="nav-link" href="nosotros.html">
                    Nosotros
                </a>

                <a class="nav-link" href="blog.html">
                    Blog
                </a>

                <a class="nav-link" href="contacto.html">
                    Contacto
                </a>

                <a class="nav-link" href="login.html">
                    Iniciar sesión
                </a>

                <a class="nav-link" href="carrito.html">
                    Carrito
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- CONTACTO -->
    <!-- ===================== -->

    <header class="page-header">

        <div class="container">

            <h1>
                Contacto
            </h1>

            <p class="mb-0">
                Si tienes alguna consulta, puedes enviarnos un mensaje.
            </p>

        </div>

    </header>


    <main class="container my-4">

        <section class="row justify-content-center">

          <div class="col-md-8 col-lg-6">

            <div class="card card-biker p-4">

            <form id="formContacto" class="form-biker">


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label" for="nombre">
                        Nombre
                    </label>

                    <input class="form-control" type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           placeholder="Ingrese su nombre">

                    <p id="errorNombre" class="text-danger small"></p>

                </div>


                <!-- CORREO -->

                <div class="mb-3">

                    <label class="form-label" for="correo">
                        Correo electrónico
                    </label>

                    <input class="form-control" type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese su correo">

                    <p id="errorCorreo" class="text-danger small"></p>

                </div>


                <!-- COMENTARIO -->

                <div class="mb-3">

                    <label class="form-label" for="comentario">
                        Comentario
                    </label>

                    <textarea class="form-control" id="comentario"
                              name="comentario"
                              rows="5"
                              maxlength="500"
                              placeholder="Escriba su mensaje">
                    </textarea>

                    <p id="errorComentario" class="text-danger small"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit"
                        class="btn btn-biker">
                    Enviar mensaje
                </button>


            </form>

            </div>

          </div>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <p>
            Zona Bikers - 2026
        </p>

    </footer>


</body>

</html>

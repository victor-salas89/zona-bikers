<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- NAVBAR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-biker">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Zona Bikers
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarPrincipal">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>

                    <a class="nav-link" href="productos.html">
                        Productos
                    </a>

                    <a class="nav-link" href="nosotros.html">
                        Nosotros
                    </a>

                    <a class="nav-link" href="blog.html">
                        Blog
                    </a>

                    <a class="nav-link" href="contacto.html">
                        Contacto
                    </a>

                    <a class="nav-link active" href="login.html">
                        Iniciar sesión
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- ENCABEZADO -->
    <!-- ===================== -->

    <header class="hero-biker">

        <div class="container text-center">

            <h1>
                Iniciar sesión
            </h1>

            <p class="lead">
                Ingresa tus datos para acceder a Zona Bikers.
            </p>

        </div>

    </header>



    <!-- ===================== -->
    <!-- FORMULARIO LOGIN -->
    <!-- ===================== -->

    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Acceso al sistema
                        </h2>


                        <form
                            id="formLogin"
                            class="form-biker"
                            novalidate>


                            <!-- CORREO -->

                            <div class="mb-3">

                                <label
                                    for="correoLogin"
                                    class="form-label">

                                    Correo electrónico

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correoLogin"
                                    name="correoLogin"
                                    maxlength="100"
                                    autocomplete="email"
                                    placeholder="ejemplo@duoc.cl">

                                <div
                                    id="errorCorreoLogin"
                                    class="text-danger mt-1">
                                </div>

                            </div>



                            <!-- CONTRASEÑA -->

                            <div class="mb-4">

                                <label
                                    for="contrasenaLogin"
                                    class="form-label">

                                    Contraseña

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="contrasenaLogin"
                                    name="contrasenaLogin"
                                    minlength="4"
                                    maxlength="10"
                                    autocomplete="current-password"
                                    placeholder="Ingrese su contraseña">

                                <div
                                    id="errorContrasenaLogin"
                                    class="text-danger mt-1">
                                </div>

                            </div>



                            <!-- BOTÓN -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-biker">

                                    Iniciar sesión

                                </button>

                            </div>

                        </form>



                        <hr class="my-4">


                        <p class="text-center mb-0">

                            ¿No tienes una cuenta?

                            <a href="registro.html">
                                Registrarse
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <div class="container">

            <p class="mb-0">
                Zona Bikers - 2026
            </p>

        </div>

    </footer>



    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Validaciones -->
    <script src="validaciones.js"></script>


</body>

</html>

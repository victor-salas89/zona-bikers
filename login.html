<form id="formLogin">

    <label for="correoLogin">Correo</label>
    <input
        type="email"
        id="correoLogin"
        maxlength="100">

    <p id="errorCorreoLogin"></p>


    <label for="contrasenaLogin">Contraseña</label>
    <input
        type="password"
        id="contrasenaLogin"
        minlength="4"
        maxlength="10">

    <p id="errorContrasenaLogin"></p>


    <button type="submit">
        Iniciar sesión
    </button>

</form>

<script src="validaciones.js"></script>

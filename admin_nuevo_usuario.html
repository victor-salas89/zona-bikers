<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo Usuario - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- MENÚ ADMINISTRADOR -->
    <!-- ===================== -->

    <nav>

        <h2>
            Zona Bikers - Administración
        </h2>

        <ul>

            <li>
                <a href="admin.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="admin_productos.html">
                    Productos
                </a>
            </li>

            <li>
                <a href="admin_usuarios.html">
                    Usuarios
                </a>
            </li>

            <li>
                <a href="index.html">
                    Volver a la tienda
                </a>
            </li>

        </ul>

    </nav>



    <!-- ===================== -->
    <!-- NUEVO USUARIO -->
    <!-- ===================== -->

    <main>

        <section>

            <h1>
                Nuevo usuario
            </h1>

            <p>
                Completa los datos para registrar un usuario en Zona Bikers.
            </p>


            <form id="formUsuario">


                <!-- RUN -->

                <div>

                    <label for="run">
                        RUN
                    </label>

                    <input type="text"
                           id="run"
                           name="run"
                           minlength="7"
                           maxlength="9"
                           placeholder="Ejemplo: 19011022K">

                    <p id="errorRun"></p>

                </div>


                <!-- NOMBRE -->

                <div>

                    <label for="nombre">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="50"
                           placeholder="Ingrese el nombre">

                    <p id="errorNombre"></p>

                </div>


                <!-- APELLIDOS -->

                <div>

                    <label for="apellidos">
                        Apellidos
                    </label>

                    <input type="text"
                           id="apellidos"
                           name="apellidos"
                           maxlength="100"
                           placeholder="Ingrese los apellidos">

                    <p id="errorApellidos"></p>

                </div>


                <!-- CORREO -->

                <div>

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese el correo">

                    <p id="errorCorreo"></p>

                </div>


                <!-- FECHA DE NACIMIENTO -->

                <div>

                    <label for="fechaNacimiento">
                        Fecha de nacimiento
                    </label>

                    <input type="date"
                           id="fechaNacimiento"
                           name="fechaNacimiento">

                </div>


                <!-- TIPO DE USUARIO -->

                <div>

                    <label for="tipoUsuario">
                        Tipo de usuario
                    </label>

                    <select id="tipoUsuario"
                            name="tipoUsuario">

                        <option value="">
                            Seleccione un tipo de usuario
                        </option>

                        <option value="administrador">
                            Administrador
                        </option>

                        <option value="cliente">
                            Cliente
                        </option>

                        <option value="vendedor">
                            Vendedor
                        </option>

                    </select>

                    <p id="errorTipoUsuario"></p>

                </div>


                <!-- REGIÓN -->

                <div>

                    <label for="region">
                        Región
                    </label>

                    <select id="region"
                            name="region">

                        <option value="">
                            Seleccione una región
                        </option>

                    </select>

                    <p id="errorRegion"></p>

                </div>


                <!-- COMUNA -->

                <div>

                    <label for="comuna">
                        Comuna
                    </label>

                    <select id="comuna"
                            name="comuna">

                        <option value="">
                            Seleccione una comuna
                        </option>

                    </select>

                    <p id="errorComuna"></p>

                </div>


                <!-- DIRECCIÓN -->

                <div>

                    <label for="direccion">
                        Dirección
                    </label>

                    <input type="text"
                           id="direccion"
                           name="direccion"
                           maxlength="300"
                           placeholder="Ingrese la dirección">

                    <p id="errorDireccion"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit">
                    Guardar usuario
                </button>


                <a href="admin_usuarios.html">
                    Cancelar
                </a>


            </form>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer>

        <p>
            Zona Bikers - Panel de Administración - 2026
        </p>

    </footer>


</body>

</html>

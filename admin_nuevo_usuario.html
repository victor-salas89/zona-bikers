<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo Usuario - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- MENÚ ADMINISTRADOR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-admin">

        <div class="container">

            <span class="navbar-brand mb-0 h2">
                Zona Bikers - Administración
            </span>

            <div class="navbar-nav">

                <a class="nav-link" href="admin.html">
                    Inicio
                </a>

                <a class="nav-link" href="admin_productos.html">
                    Productos
                </a>

                <a class="nav-link" href="admin_usuarios.html">
                    Usuarios
                </a>

                <a class="nav-link" href="index.html">
                    Volver a la tienda
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- NUEVO USUARIO -->
    <!-- ===================== -->

    <main class="container my-4">

        <section class="row justify-content-center">

          <div class="col-lg-8">

            <div class="card card-biker p-4">

            <h1 class="h3">
                Nuevo usuario
            </h1>

            <p>
                Completa los datos para registrar un usuario en Zona Bikers.
            </p>


            <form id="formUsuario" class="form-biker">


                <!-- RUN -->

                <div class="mb-3">

                    <label class="form-label" for="run">
                        RUN
                    </label>

                    <input class="form-control" type="text"
                           id="run"
                           name="run"
                           minlength="7"
                           maxlength="9"
                           placeholder="Ejemplo: 19011022K">

                    <p id="errorRun" class="text-danger small"></p>

                </div>


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label" for="nombre">
                        Nombre
                    </label>

                    <input class="form-control" type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="50"
                           placeholder="Ingrese el nombre">

                    <p id="errorNombre" class="text-danger small"></p>

                </div>


                <!-- APELLIDOS -->

                <div class="mb-3">

                    <label class="form-label" for="apellidos">
                        Apellidos
                    </label>

                    <input class="form-control" type="text"
                           id="apellidos"
                           name="apellidos"
                           maxlength="100"
                           placeholder="Ingrese los apellidos">

                    <p id="errorApellidos" class="text-danger small"></p>

                </div>


                <!-- CORREO -->

                <div class="mb-3">

                    <label class="form-label" for="correo">
                        Correo electrónico
                    </label>

                    <input class="form-control" type="email"
                           id="correo"
                           name="correo"
                           maxlength="100"
                           placeholder="Ingrese el correo">

                    <p id="errorCorreo" class="text-danger small"></p>

                </div>


                <!-- FECHA DE NACIMIENTO -->

                <div class="mb-3">

                    <label class="form-label" for="fechaNacimiento">
                        Fecha de nacimiento
                    </label>

                    <input class="form-control" type="date"
                           id="fechaNacimiento"
                           name="fechaNacimiento">

                </div>


                <!-- TIPO DE USUARIO -->

                <div class="mb-3">

                    <label class="form-label" for="tipoUsuario">
                        Tipo de usuario
                    </label>

                    <select class="form-select" id="tipoUsuario"
                            name="tipoUsuario">

                        <option value="">
                            Seleccione un tipo de usuario
                        </option>

                        <option value="administrador">
                            Administrador
                        </option>

                        <option value="cliente">
                            Cliente
                        </option>

                        <option value="vendedor">
                            Vendedor
                        </option>

                    </select>

                    <p id="errorTipoUsuario" class="text-danger small"></p>

                </div>


                <!-- REGIÓN -->

                <div class="mb-3">

                    <label class="form-label" for="region">
                        Región
                    </label>

                    <select class="form-select" id="region"
                            name="region">

                        <option value="">
                            Seleccione una región
                        </option>

                    </select>

                    <p id="errorRegion" class="text-danger small"></p>

                </div>


                <!-- COMUNA -->

                <div class="mb-3">

                    <label class="form-label" for="comuna">
                        Comuna
                    </label>

                    <select class="form-select" id="comuna"
                            name="comuna">

                        <option value="">
                            Seleccione una comuna
                        </option>

                    </select>

                    <p id="errorComuna" class="text-danger small"></p>

                </div>


                <!-- DIRECCIÓN -->

                <div class="mb-3">

                    <label class="form-label" for="direccion">
                        Dirección
                    </label>

                    <input class="form-control" type="text"
                           id="direccion"
                           name="direccion"
                           maxlength="300"
                           placeholder="Ingrese la dirección">

                    <p id="errorDireccion" class="text-danger small"></p>

                </div>


                <!-- BOTÓN -->

                <button type="submit"
                        class="btn btn-biker">
                    Guardar usuario
                </button>

                <a href="admin_usuarios.html"
                   class="btn btn-outline-biker">
                    Cancelar
                </a>


            </form>

            </div>

          </div>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <p>
            Zona Bikers - Panel de Administración - 2026
        </p>

    </footer>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo Producto - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- MENÚ ADMINISTRADOR -->
    <!-- ===================== -->

    <nav>

        <h2>
            Zona Bikers - Administración
        </h2>

        <ul>

            <li>
                <a href="admin.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="admin_productos.html">
                    Productos
                </a>
            </li>

            <li>
                <a href="admin_usuarios.html">
                    Usuarios
                </a>
            </li>

            <li>
                <a href="index.html">
                    Volver a la tienda
                </a>
            </li>

        </ul>

    </nav>



    <!-- ===================== -->
    <!-- NUEVO PRODUCTO -->
    <!-- ===================== -->

    <main>

        <section>

            <h1>
                Nuevo producto
            </h1>

            <p>
                Completa los datos para agregar un producto a Zona Bikers.
            </p>


            <form id="formProducto">


                <!-- CÓDIGO -->

                <div>

                    <label for="codigo">
                        Código del producto
                    </label>

                    <input type="text"
                           id="codigo"
                           name="codigo"
                           minlength="3"
                           placeholder="Ejemplo: CAS001">

                    <p id="errorCodigo"></p>

                </div>


                <!-- NOMBRE -->

                <div>

                    <label for="nombreProducto">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombreProducto"
                           name="nombreProducto"
                           maxlength="100"
                           placeholder="Ingrese el nombre del producto">

                    <p id="errorNombreProducto"></p>

                </div>


                <!-- DESCRIPCIÓN -->

                <div>

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea id="descripcion"
                              name="descripcion"
                              rows="5"
                              maxlength="500"
                              placeholder="Ingrese una descripción">
                    </textarea>

                    <p id="errorDescripcion"></p>

                </div>


                <!-- PRECIO -->

                <div>

                    <label for="precio">
                        Precio
                    </label>

                    <input type="number"
                           id="precio"
                           name="precio"
                           min="0"
                           step="0.01"
                           placeholder="Ingrese el precio">

                    <p id="errorPrecio"></p>

                </div>


                <!-- STOCK -->

                <div>

                    <label for="stock">
                        Stock
                    </label>

                    <input type="number"
                           id="stock"
                           name="stock"
                           min="0"
                           step="1"
                           placeholder="Ingrese el stock">

                    <p id="errorStock"></p>

                </div>


                <!-- STOCK CRÍTICO -->

                <div>

                    <label for="stockCritico">
                        Stock crítico
                    </label>

                    <input type="number"
                           id="stockCritico"
                           name="stockCritico"
                           min="0"
                           step="1"
                           placeholder="Ingrese stock crítico">

                    <p id="errorStockCritico"></p>

                </div>


                <!-- CATEGORÍA -->

                <div>

                    <label for="categoria">
                        Categoría
                    </label>

                    <select id="categoria"
                            name="categoria">

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="cascos">
                            Cascos
                        </option>

                        <option value="guantes">
                            Guantes
                        </option>

                        <option value="chaquetas">
                            Chaquetas
                        </option>

                        <option value="protecciones">
                            Protecciones
                        </option>

                        <option value="otros">
                            Otros
                        </option>

                    </select>

                    <p id="errorCategoria"></p>

                </div>


                <!-- IMAGEN -->

                <div>

                    <label for="imagen">
                        Imagen
                    </label>

                    <input type="file"
                           id="imagen"
                           name="imagen">

                </div>


                <!-- BOTÓN -->

                <button type="submit">
                    Guardar producto
                </button>


                <a href="admin_productos.html">
                    Cancelar
                </a>


            </form>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer>

        <p>
            Zona Bikers - Panel de Administración - 2026
        </p>

    </footer>


</body>

</html>

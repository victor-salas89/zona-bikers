<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo Producto - Zona Bikers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados Zona Bikers -->
    <link
        href="css/estilos.css"
        rel="stylesheet">

</head>


<body>


    <!-- ===================== -->
    <!-- MENÚ ADMINISTRADOR -->
    <!-- ===================== -->

    <nav class="navbar navbar-expand-lg navbar-admin">

        <div class="container">

            <span class="navbar-brand mb-0 h2">
                Zona Bikers - Administración
            </span>

            <div class="navbar-nav">

                <a class="nav-link" href="admin.html">
                    Inicio
                </a>

                <a class="nav-link" href="admin_productos.html">
                    Productos
                </a>

                <a class="nav-link" href="admin_usuarios.html">
                    Usuarios
                </a>

                <a class="nav-link" href="index.html">
                    Volver a la tienda
                </a>

            </div>

        </div>

    </nav>



    <!-- ===================== -->
    <!-- NUEVO PRODUCTO -->
    <!-- ===================== -->

    <main class="container my-4">

        <section class="row justify-content-center">

          <div class="col-lg-8">

            <div class="card card-biker p-4">

            <h1 class="h3">
                Nuevo producto
            </h1>

            <p>
                Completa los datos para agregar un producto a Zona Bikers.
            </p>


            <form id="formProducto" class="form-biker">


                <!-- CÓDIGO -->

                <div class="mb-3">

                    <label class="form-label" for="codigo">
                        Código del producto
                    </label>

                    <input class="form-control" type="text"
                           id="codigo"
                           name="codigo"
                           minlength="3"
                           placeholder="Ejemplo: CAS001">

                    <p id="errorCodigo" class="text-danger small"></p>

                </div>


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label" for="nombreProducto">
                        Nombre
                    </label>

                    <input class="form-control" type="text"
                           id="nombreProducto"
                           name="nombreProducto"
                           maxlength="100"
                           placeholder="Ingrese el nombre del producto">

                    <p id="errorNombreProducto" class="text-danger small"></p>

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="mb-3">

                    <label class="form-label" for="descripcion">
                        Descripción
                    </label>

                    <textarea class="form-control" id="descripcion"
                              name="descripcion"
                              rows="5"
                              maxlength="500"
                              placeholder="Ingrese una descripción">
                    </textarea>

                    <p id="errorDescripcion" class="text-danger small"></p>

                </div>


                <!-- PRECIO -->

                <div class="mb-3">

                    <label class="form-label" for="precio">
                        Precio
                    </label>

                    <input class="form-control" type="number"
                           id="precio"
                           name="precio"
                           min="0"
                           step="0.01"
                           placeholder="Ingrese el precio">

                    <p id="errorPrecio" class="text-danger small"></p>

                </div>


                <!-- STOCK -->

                <div class="mb-3">

                    <label class="form-label" for="stock">
                        Stock
                    </label>

                    <input class="form-control" type="number"
                           id="stock"
                           name="stock"
                           min="0"
                           step="1"
                           placeholder="Ingrese el stock">

                    <p id="errorStock" class="text-danger small"></p>

                </div>


                <!-- STOCK CRÍTICO -->

                <div class="mb-3">

                    <label class="form-label" for="stockCritico">
                        Stock crítico
                    </label>

                    <input class="form-control" type="number"
                           id="stockCritico"
                           name="stockCritico"
                           min="0"
                           step="1"
                           placeholder="Ingrese stock crítico">

                    <p id="errorStockCritico" class="text-danger small"></p>

                </div>


                <!-- CATEGORÍA -->

                <div class="mb-3">

                    <label class="form-label" for="categoria">
                        Categoría
                    </label>

                    <select class="form-select" id="categoria"
                            name="categoria">

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="cascos">
                            Cascos
                        </option>

                        <option value="guantes">
                            Guantes
                        </option>

                        <option value="chaquetas">
                            Chaquetas
                        </option>

                        <option value="protecciones">
                            Protecciones
                        </option>

                        <option value="otros">
                            Otros
                        </option>

                    </select>

                    <p id="errorCategoria" class="text-danger small"></p>

                </div>


                <!-- IMAGEN -->

                <div class="mb-3">

                    <label class="form-label" for="imagen">
                        Imagen
                    </label>

                    <input class="form-control" type="file"
                           id="imagen"
                           name="imagen">

                </div>


                <!-- BOTÓN -->

                <button type="submit"
                        class="btn btn-biker">
                    Guardar producto
                </button>

                <a href="admin_productos.html"
                   class="btn btn-outline-biker">
                    Cancelar
                </a>


            </form>

            </div>

          </div>

        </section>

    </main>



    <!-- ===================== -->
    <!-- FOOTER -->
    <!-- ===================== -->

    <footer class="footer-biker">

        <p>
            Zona Bikers - Panel de Administración - 2026
        </p>

    </footer>


</body>

</html>
